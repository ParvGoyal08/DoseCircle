# Amplify Hosting build for the web app in this pnpm monorepo.
# Set AMPLIFY_MONOREPO_APP_ROOT=web and the VITE_* variables in the Amplify console (values come from `cdk deploy` outputs).
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24 && nvm use 24
            - corepack enable
            - cd .. && pnpm install --frozen-lockfile && cd web
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../node_modules/.pnpm/**/*
