# Response headers for Amplify Hosting (monorepo apps read this file from the app root).
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://*.s3.ap-south-1.amazonaws.com;
          font-src 'self';
          media-src 'self';
          connect-src 'self' https://*.execute-api.ap-south-1.amazonaws.com https://cognito-idp.ap-south-1.amazonaws.com https://*.s3.ap-south-1.amazonaws.com;
          worker-src 'self';
          manifest-src 'self';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self'
  # The service worker must always be fresh, or users keep an old app.
  - pattern: "/sw.js"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: "/assets/**/*"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/audio/**/*"
    headers:
      - key: Cache-Control
        value: public, max-age=604800
